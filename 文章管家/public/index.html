<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章管家</title>
    <!-- 首屏防白闪：必须在样式表之前定下 data-theme，否则深色用户会先看到一瞬白底。
         判定顺序和站点一致：手动选过听手动，没选过跟系统。 -->
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('mgr.theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : systemDark ? 'dark' : 'light';
        } catch {
          /* 隐私模式下 localStorage 会抛错，退化成浅色即可 */
        }
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!--
      三列布局：
        side   左侧栏（文章 / 入库 / 标签 / 分类）
        drawer 第二列，点标签或分类才弹出来，宽度可拖、可记
        main   文章格子墙，始终显示全部文章，不随导航切换而消失
      入库和编辑都不是「页面」，而是盖在 main 上面的悬浮窗。
    -->
    <div class="app">
      <aside class="side" id="side">
        <div class="brand"><i></i>文章管家</div>
        <button class="nav-item" data-nav="posts" aria-current="true">文章</button>
        <button class="nav-item" data-nav="ingest">入库</button>
        <button class="nav-item" data-nav="tags">标签</button>
        <button class="nav-item" data-nav="categories">分类</button>
        <button class="nav-item" data-nav="trash">回收箱</button>
        <div class="side-foot" id="dirHint">正在读取…</div>
      </aside>

      <div class="resizer" id="resizerSide" title="拖动调整左侧栏宽度（双击复位）"></div>

      <section class="drawer" id="drawer" hidden>
        <div class="drawer-head">
          <span id="drawerTitle">标签</span>
          <button class="btn ghost tiny" id="drawerClose" title="收起（Esc）">×</button>
        </div>
        <div class="drawer-hint" id="drawerHint">把左边的项拖到文章上，或把文章拖进这里</div>
        <div class="drawer-search">
          <input type="search" id="drawerSearch" placeholder="搜索标签" autocomplete="off" />
        </div>
        <div class="drawer-list" id="drawerList"></div>
      </section>

      <div class="resizer" id="resizerDrawer" hidden title="拖动调整这一列宽度（双击复位）"></div>

      <main class="main">
        <div class="topbar">
          <h1 id="pageTitle">全部文章</h1>
          <span class="grow"></span>
          <span class="status" title="站点本地预览是否在运行">
            <span class="dot" id="devDot"></span><span id="devText">检测中</span>
          </span>
          <span class="status" id="stats">—</span>
          <!-- 两个图标都渲染出来，由 CSS 按当前主题只显示一个，
               这样切换主题不用动 DOM，也不会出现图标闪一下 -->
          <button class="theme-toggle" id="btnTheme" type="button" aria-label="切换白天 / 黑夜" title="切换白天 / 黑夜">
            <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1Z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </div>

        <div class="toolbar">
          <input type="search" id="search" placeholder="搜索标题、标签、文件名" />
          <select id="sortBy">
            <option value="date">按日期</option>
            <option value="title">按标题</option>
            <option value="chars">按字数</option>
          </select>
          <span class="grow"></span>
          <button class="btn" id="btnReload">刷新</button>
          <button class="btn primary" id="btnOpenIngest">入库新文章</button>
        </div>

        <div class="grid" id="postGrid"></div>
      </main>
    </div>

    <!-- ==================== 入库悬浮窗 ==================== -->
    <div class="modal" id="modalIngest" hidden>
      <div class="modal-mask" data-close="ingest"></div>
      <div class="modal-card wide">
        <header class="modal-head">
          <strong>入库新文章</strong>
          <span class="modal-sub">拖一个 .md 进来，先看诊断，再决定写不写</span>
          <span class="grow"></span>
          <button class="btn ghost tiny" data-close="ingest" title="关闭（Esc）">×</button>
        </header>

        <div class="modal-body">
          <div class="drop" id="drop">
            <strong>把 .md 文件拖到这里</strong>
            或者点一下选文件。只读不写，先告诉你会发生什么。
            <input type="file" id="fileInput" accept=".md,.markdown,text/markdown" hidden />
          </div>

          <div id="ingestBody" hidden>
            <div class="two-col">
              <div class="panel">
                <h2>诊断：这篇会发生什么</h2>
                <div class="checks" id="checks"></div>
                <div class="hint" style="font-size: 12px; color: var(--muted); margin-top: 12px">
                  诊断只是预测，真实结果以站点渲染为准。到这里还没有写任何文件。
                </div>
              </div>

              <div class="panel">
                <h2>起名与归类</h2>

                <div class="field">
                  <label for="gSlug">文件名（= URL，自动生成，重复会自动加序号）</label>
                  <input type="text" id="gSlug" spellcheck="false" />
                  <div class="hint" id="slugPreview">/posts/…/</div>
                  <div class="picker" id="pickSlug"></div>
                </div>

                <div class="field">
                  <label for="gTitle">标题</label>
                  <input type="text" id="gTitle" />
                  <div class="picker" id="pickTitle"></div>
                </div>

                <div class="field">
                  <label for="gDesc">摘要（会显示在列表和搜索结果里）</label>
                  <textarea id="gDesc" rows="3"></textarea>
                  <div class="hint" id="descHint"></div>
                </div>

                <div class="row">
                  <div class="field">
                    <label for="gDate">发布日期</label>
                    <input type="date" id="gDate" />
                  </div>
                  <div class="field">
                    <label>分类（可空，可多个）</label>
                    <div class="terms" id="gCats" data-kind="categories" data-placeholder="输入可搜索，回车新建"></div>
                  </div>
                </div>

                <div class="field">
                  <label>标签（可空，可多个）</label>
                  <div class="terms" id="gTags" data-kind="tags" data-placeholder="输入可搜索，回车新建"></div>
                </div>

                <div class="field">
                  <label class="switch">
                    <input type="checkbox" id="gDraft" />
                    <span>存为草稿</span>
                  </label>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 16px">
                  <button class="btn primary" id="btnIngest">写入站点</button>
                  <button class="btn" id="btnResetIngest">换一个文件</button>
                </div>
              </div>
            </div>

            <div class="panel" style="margin-top: 18px">
              <h2>正文预览（前 40 行，只读）</h2>
              <div class="preview" id="bodyPreview"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== 编辑悬浮窗 ==================== -->
    <div class="modal" id="modalEdit" hidden>
      <div class="modal-mask" data-close="edit"></div>
      <div class="modal-card wide">
        <header class="modal-head">
          <strong>编辑文章</strong>
          <span class="chip" id="editSlug"></span>
          <span class="grow"></span>
          <button class="btn" id="btnOpenPost">在站点打开</button>
          <button class="btn ghost" id="btnReloadPost">重新读盘</button>
          <button class="btn ghost tiny" data-close="edit" title="关闭（Esc）">×</button>
        </header>

        <div class="modal-body">
          <div class="editor">
            <div class="panel">
              <h2>元数据（frontmatter）</h2>

              <div class="field">
                <label for="fTitle">标题</label>
                <input type="text" id="fTitle" />
              </div>

              <div class="field">
                <label for="fDesc">摘要（会显示在列表和搜索结果里，必填）</label>
                <textarea id="fDesc" rows="3"></textarea>
              </div>

              <div class="row">
                <div class="field">
                  <label for="fDate">发布日期</label>
                  <input type="date" id="fDate" />
                </div>
                <div class="field">
                  <label for="fUpdated">更新日期（不填就不显示）</label>
                  <input type="date" id="fUpdated" />
                </div>
              </div>

              <div class="field">
                <label>分类（可空，可多个，输入可搜索）</label>
                <div class="terms" id="fCats" data-kind="categories" data-placeholder="输入可搜索，回车新建"></div>
              </div>

              <div class="field">
                <label>标签（可空，可多个，输入可搜索）</label>
                <div class="terms" id="fTags" data-kind="tags" data-placeholder="输入可搜索，回车新建"></div>
              </div>

              <div class="field">
                <label class="switch">
                  <input type="checkbox" id="fDraft" />
                  <span>存为草稿（不生成页面、不进列表）</span>
                </label>
              </div>
            </div>

            <div class="panel body-panel">
              <h2>正文（Markdown，一个字都不会被工具改动）</h2>
              <textarea class="body" id="fBody" spellcheck="false"></textarea>
              <div class="hint">改正文建议还是回 Obsidian 改；这里适合修错别字。</div>
            </div>
          </div>
        </div>

        <footer class="modal-foot">
          <span class="state" id="saveState">没有改动</span>
          <span class="grow"></span>
          <button class="btn" data-close="edit">关闭</button>
          <button class="btn primary" id="btnSave">保存（Ctrl+S）</button>
        </footer>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
