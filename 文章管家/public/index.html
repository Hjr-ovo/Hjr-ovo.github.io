<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章管家</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand"><i></i>文章管家</div>
        <button class="nav-item" data-view="list" aria-current="true">文章</button>
        <button class="nav-item" data-view="ingest">入库</button>
        <div class="side-foot" id="dirHint">正在读取…</div>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1 id="pageTitle">文章</h1>
          <span class="grow"></span>
          <span class="status" title="站点本地预览是否在运行">
            <span class="dot" id="devDot"></span><span id="devText">检测中</span>
          </span>
          <span class="status" id="stats">—</span>
        </div>

        <!-- ========== 文章列表 ========== -->
        <section id="view-list">
          <div class="toolbar">
            <input type="search" id="search" placeholder="搜索标题、标签、文件名" />
            <select id="filterCat" style="width: auto; min-width: 110px">
              <option value="">全部分类</option>
            </select>
            <select id="sortBy" style="width: auto; min-width: 110px">
              <option value="date">按日期</option>
              <option value="title">按标题</option>
              <option value="chars">按字数</option>
            </select>
            <span class="grow"></span>
            <button class="btn" id="btnReload">刷新</button>
            <button class="btn primary" data-goto="ingest">入库新文章</button>
          </div>
          <div id="postList"></div>
        </section>

        <!-- ========== 单篇编辑 ========== -->
        <section id="view-edit" hidden>
          <div class="toolbar">
            <button class="btn ghost" id="btnBack">← 返回列表</button>
            <span class="grow"></span>
            <span class="chip" id="editSlug"></span>
            <button class="btn" id="btnOpenPost">在站点打开</button>
          </div>

          <div class="editor">
            <div class="panel">
              <h2>元数据（frontmatter）</h2>

              <div class="field">
                <label for="fTitle">标题</label>
                <input type="text" id="fTitle" />
              </div>

              <div class="field">
                <label for="fDesc">摘要（会显示在列表和搜索结果里，必填）</label>
                <textarea id="fDesc" rows="3"></textarea>
              </div>

              <div class="row">
                <div class="field">
                  <label for="fDate">发布日期</label>
                  <input type="date" id="fDate" />
                </div>
                <div class="field">
                  <label for="fUpdated">更新日期（不填就不显示）</label>
                  <input type="date" id="fUpdated" />
                </div>
              </div>

              <div class="field">
                <label for="fCats">分类（至少一个，多个用逗号隔开）</label>
                <input type="text" id="fCats" placeholder="例如：数据结构, 算法" />
                <div class="picker" id="pickCats"></div>
              </div>

              <div class="field">
                <label for="fTags">标签（可空，多个用逗号隔开）</label>
                <input type="text" id="fTags" placeholder="例如：哈希表, 冲突处理" />
                <div class="picker" id="pickTags"></div>
              </div>

              <div class="field">
                <label class="switch">
                  <input type="checkbox" id="fDraft" />
                  <span>存为草稿（不生成页面、不进列表）</span>
                </label>
              </div>
            </div>

            <div class="panel">
              <h2>正文（Markdown，一个字都不会被工具改动）</h2>
              <textarea class="body" id="fBody" spellcheck="false"></textarea>
              <div class="hint" style="font-size: 12px; color: var(--muted); margin-top: 6px">
                改正文建议还是回 Obsidian 改；这里适合修错别字。
              </div>
            </div>

            <div class="savebar">
              <button class="btn primary" id="btnSave">保存</button>
              <button class="btn" id="btnReloadPost">重新从磁盘读</button>
              <span class="state" id="saveState">没有改动</span>
            </div>
          </div>
        </section>

        <!-- ========== 入库 ========== -->
        <section id="view-ingest" hidden>
          <div class="drop" id="drop">
            <strong>把 .md 文件拖到这里</strong>
            或者点一下选文件。只读不写，先告诉你会发生什么。
            <input type="file" id="fileInput" accept=".md,.markdown,text/markdown" hidden />
          </div>

          <div id="ingestBody" hidden style="margin-top: 20px">
            <div class="two-col">
              <div class="panel">
                <h2>诊断：这篇会发生什么</h2>
                <div class="checks" id="checks"></div>
                <div class="hint" style="font-size: 12px; color: var(--muted); margin-top: 12px">
                  诊断只是预测，真实结果以站点渲染为准。到这里还没有写任何文件。
                </div>
              </div>

              <div class="panel">
                <h2>起名与归类</h2>

                <div class="field">
                  <label for="gSlug">文件名（= URL，只能用英文小写、数字、短横线）</label>
                  <input type="text" id="gSlug" />
                  <div class="hint" id="slugPreview">/posts/…/</div>
                  <div class="picker" id="pickSlug"></div>
                </div>

                <div class="field">
                  <label for="gTitle">标题</label>
                  <input type="text" id="gTitle" />
                </div>

                <div class="field">
                  <label for="gDesc">摘要（必填）</label>
                  <textarea id="gDesc" rows="3"></textarea>
                  <div class="hint" id="descHint"></div>
                </div>

                <div class="row">
                  <div class="field">
                    <label for="gDate">发布日期</label>
                    <input type="date" id="gDate" />
                  </div>
                  <div class="field">
                    <label for="gCats">分类（至少一个）</label>
                    <input type="text" id="gCats" />
                  </div>
                </div>

                <div class="field">
                  <label for="gTags">标签（可空，逗号隔开）</label>
                  <input type="text" id="gTags" />
                  <div class="picker" id="pickGTags"></div>
                </div>

                <div class="field">
                  <label class="switch">
                    <input type="checkbox" id="gDraft" />
                    <span>存为草稿</span>
                  </label>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 16px">
                  <button class="btn primary" id="btnIngest">写入站点</button>
                  <button class="btn" id="btnResetIngest">换一个文件</button>
                </div>
              </div>
            </div>

            <div class="panel" style="margin-top: 18px">
              <h2>正文预览（前 40 行，只读）</h2>
              <div class="preview" id="bodyPreview"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
